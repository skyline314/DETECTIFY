<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detectify - Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
        .hero-card { padding: 3rem; border-radius: 20px; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 500px; }
        .btn-custom { padding: 12px 25px; border-radius: 50px; font-weight: bold; width: 100%; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="hero-card">
        <h1 class="display-5 fw-bold text-primary mb-3">Detectify</h1>
        <p class="text-muted mb-4">Pilih menu untuk memulai deteksi AI.</p>
        
        <div class="d-grid gap-2">
            <a href="/auth/console" class="btn btn-primary btn-custom shadow">Buka Developer Console</a>
            
            <a href="/auth/login" class="btn btn-outline-dark btn-custom">Login User</a>
            
            <hr>
            <p class="small text-secondary">Server Status: <span class="text-success">Online</span></p>

</html>
