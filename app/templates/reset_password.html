<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DetectiFy — Reset Password</title>
    <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
    <style>
        .reset-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-card {
            width: min(440px, 100%);
            border-radius: 24px;
            padding: 40px 32px;
            text-align: center;
        }

        html[data-theme="light"] .reset-card {
            background: #fff;
            border: 1px solid rgba(0, 0, 0, .08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .12);
        }

        html[data-theme="dark"] .reset-card {
            background: linear-gradient(150deg, #111827, #0f172a);
            border: 1px solid rgba(255, 255, 255, .1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
        }

        .reset-card__icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #0ea5c7, #7c3aed);
        }

        .reset-card__icon svg {
            color: #fff;
        }

        .reset-card__title {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 8px;
        }

        .reset-card__desc {
            font-size: 14px;
            line-height: 1.6;
            opacity: .7;
            margin: 0 0 24px;
        }

        .reset-card__form {
            text-align: left;
        }

        .reset-card__field {
            margin-bottom: 16px;
        }

        .reset-card__field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .reset-card__field input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color .15s;
        }

        html[data-theme="light"] .reset-card__field input {
            border: 1px solid rgba(0, 0, 0, .15);
            background: #f9fafb;
            color: #111;
        }

        html[data-theme="dark"] .reset-card__field input {
            border: 1px solid rgba(255, 255, 255, .15);
            background: rgba(255, 255, 255, .05);
            color: #eaf2ff;
        }

        .reset-card__field input:focus {
            outline: none;
            border-color: #0ea5c7;
        }

        #resetMsg {
            display: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: center;
        }

        .reset-card__btn {
            width: 100%;
            padding: 14px;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #0ea5c7, #7c3aed);
            color: #fff;
            box-shadow: 0 8px 24px rgba(14, 165, 199, .25);
            transition: transform .15s, filter .15s;
        }

        .reset-card__btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .reset-card__btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .reset-card__back {
            display: inline-block;
            margin-top: 16px;
            font-size: 13px;
            color: #0ea5c7;
            text-decoration: none;
            font-weight: 500;
        }

        .reset-card__back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="reset-page">
        <div class="reset-card">
            <div class="reset-card__icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                    <rect x="5" y="11" width="14" height="10" rx="3" stroke="currentColor" stroke-width="2" />
                    <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    <circle cx="12" cy="16" r="1.5" fill="currentColor" />
                </svg>
            </div>

            <h1 class="reset-card__title">Create New Password</h1>
            <p class="reset-card__desc">Enter your new password below. Make sure it's at least 6 characters.</p>

            <div id="resetMsg"></div>

            <form id="resetForm" class="reset-card__form">
                <input type="hidden" id="resetToken" value="{{ token }}" />

                <div class="reset-card__field">
                    <label for="newPassword">New Password</label>
                    <input id="newPassword" type="password" placeholder="Enter new password" required minlength="6" />
                </div>

                <div class="reset-card__field">
                    <label for="confirmPassword">Confirm Password</label>
                    <input id="confirmPassword" type="password" placeholder="Confirm new password" required
                        minlength="6" />
                </div>

                <button class="reset-card__btn" type="submit" id="resetSubmitBtn">Reset Password</button>
            </form>

            <a class="reset-card__back" href="/auth/get-started">← Back to Login</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script>
        document.getElementById("resetForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const token = document.getElementById("resetToken").value;
            const newPass = document.getElementById("newPassword").value;
            const confirmPass = document.getElementById("confirmPassword").value;
            const btn = document.getElementById("resetSubmitBtn");
            const msg = document.getElementById("resetMsg");

            // Validate match
            if (newPass !== confirmPass) {
                msg.style.display = "block";
                msg.style.background = "rgba(239,68,68,.12)";
                msg.style.color = "#ef4444";
                msg.textContent = "Passwords do not match!";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Processing...";

            try {
                const res = await fetch("/auth/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, new_password: newPass }),
                });
                const data = await res.json();

                msg.style.display = "block";
                if (res.ok) {
                    msg.style.background = "rgba(34,197,94,.12)";
                    msg.style.color = "#16a34a";
                    msg.textContent = data.message || "Password berhasil diubah!";
                    btn.textContent = "Done ✓";

                    // Redirect to login after 2s
                    setTimeout(() => {
                        window.location.href = "/auth/get-started?verified=success&msg=Password+berhasil+diubah!+Silakan+login.";
                    }, 2000);
                } else {
                    msg.style.background = "rgba(239,68,68,.12)";
                    msg.style.color = "#ef4444";
                    msg.textContent = data.error || "Gagal reset password.";
                    btn.disabled = false;
                    btn.textContent = "Reset Password";
                }
            } catch {
                msg.style.display = "block";
                msg.style.background = "rgba(239,68,68,.12)";
                msg.style.color = "#ef4444";
                msg.textContent = "Network error. Please try again.";
                btn.disabled = false;
                btn.textContent = "Reset Password";
            }
        });
    </script>
</body>

</html>
