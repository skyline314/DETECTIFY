<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DetectiFy — My Account</title>

  <!-- Font (mirip tampilan figma kamu) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="profilel.css">
</head>

<body>
  <div class="frame">
    <div class="topbar">
      <div class="brand">DetectiFy</div>
    </div>

    <div class="wrap">
      <div style="width:100%; display:flex; flex-direction:column; align-items:center;">
        <h1>My Account</h1>

        <div class="panel">
          <!-- Username -->
          <!-- Username -->
<div class="label">Username</div>
<div class="field">
  <input id="usernameInput" class="value" type="text" placeholder="Enter username">
  <button class="icon-btn" type="button" aria-label="Copy username" id="copyUsernameBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="9" y="9" width="10" height="10" rx="2"></rect>
      <path d="M5 15V7a2 2 0 0 1 2-2h8"></path>
    </svg>
  </button>
</div>

<!-- Email -->
<div class="label">Email</div>
<div class="field">
  <input id="emailInput" class="value" type="email" placeholder="Enter email">
  <button class="icon-btn" type="button" aria-label="Copy email" id="copyEmailBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="9" y="9" width="10" height="10" rx="2"></rect>
      <path d="M5 15V7a2 2 0 0 1 2-2h8"></path>
    </svg>
  </button>
</div>


          <!-- Security -->
          <div class="label">Security</div>
          <div class="security">
            <div class="sec-item" role="button" tabindex="0" id="changePasswordBtn">
              <div class="sec-left">
                <!-- lock -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                  <path d="M8 11V8a4 4 0 1 1 8 0v3"></path>
                </svg>
                <span>Change Password</span>
              </div>
              <svg class="chev" viewBox="0 0 24 24" fill="none">
                <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>

            <div class="sec-item" role="button" tabindex="0" id="logoutBtn">
              <div class="sec-left">
                <!-- logout -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M10 17l-1 0a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4h1"></path>
                  <path d="M16 7l5 5-5 5"></path>
                  <path d="M21 12H9"></path>
                </svg>
                <span>Log out</span>
              </div>
              <svg class="chev" viewBox="0 0 24 24" fill="none">
                <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Optional: copy action (kalau kamu mau icon copy-nya beneran jalan) -->
  <script src="profilel.js"></script>
</body>
</html>
